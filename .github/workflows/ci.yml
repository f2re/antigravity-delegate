name: Проверка

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверить синтаксис
        run: python -m compileall -q scripts skills skill tests

      - name: Выполнить тесты
        run: python -m unittest discover -s tests -v

      - name: Проверить установщик без записи
        run: python scripts/install_skill.py --target codex --scope user --dry-run --pretty
